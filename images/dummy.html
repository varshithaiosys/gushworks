<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sticky Header</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:2000px;
    }

    /* Top Header */
    .header{
      width:100%;
      background:#f5f5f5;
      border-top:2px solid #4b4b4b;
      border-bottom:4px solid #00a98f;
      padding:12px 40px;
      position:relative;
      z-index:1000;
      transition:all 0.4s ease;
    }

    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    /* Logo */
    .logo img{
      height:40px;
    }

    /* Nav Links */
    .nav-links{
      display:flex;
      align-items:center;
      gap:35px;
    }

    .nav-links a{
      text-decoration:none;
      color:#222;
      font-size:14px;
      transition:0.3s;
    }

    .nav-links a:hover{
      color:#00a98f;
    }

    /* Dropdown Arrow */
    .dropdown::after{
      content:"▼";
      font-size:10px;
      margin-left:6px;
    }

    /* Button */
    .contact-btn{
      background:#2d3e75;
      color:#fff !important;
      padding:10px 20px;
      border-radius:8px;
      transition:0.3s;
    }

    .contact-btn:hover{
      background:#1f2d57;
    }

    /* Sticky Header */
    .sticky{
      position:fixed;
      top:-100px;
      left:0;
      width:100%;
      animation:slideDown 0.5s forwards;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    @keyframes slideDown{
      from{
        top:-100px;
      }
      to{
        top:0;
      }
    }

    /* Demo Content */
    .hero{
      height:100vh;
      background:linear-gradient(to right,#f8f8f8,#eaeaea);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:40px;
      color:#555;
    }

    .content{
      padding:80px 40px;
      font-size:18px;
      line-height:1.8;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <div class="navbar">

      <!-- Logo -->
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Placeholder.svg" alt="Logo">
      </div>

      <!-- Navigation -->
      <div class="nav-links">
        <a href="#">About Us</a>
        <a href="#" class="dropdown">Products</a>
        <a href="#" class="contact-btn">Contact Us</a>
      </div>

    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    Scroll Down
  </section>

  <!-- Content -->
  <section class="content">
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit.
      Reprehenderit officia possimus pariatur, repellendus officiis
      minima molestiae illo earum.
    </p>
  </section>

  <script>
    const header = document.getElementById("header");

    window.addEventListener("scroll", () => {

      if(window.scrollY > 200){
        header.classList.add("sticky");
      } else {
        header.classList.remove("sticky");
      }

    });
  </script>

</body>
</html>
